<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LightUsagi</title>
  <script>
    // Set the theme before the page paints so a reload does not flash the wrong one.
    try { document.documentElement.dataset.theme = localStorage.getItem("lightusagi-theme") || "light"; } catch (error) { document.documentElement.dataset.theme = "light"; }
  </script>
  <style>
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #000;
      --panel: #0e0e0e;
      --ink: #f2f2f2;
      --muted: #8b8b8b;
      --line: #2a2a2a;
      --you: #0b63e5;
      --field: #141414;
      --hover: #1f1f1f;
      --danger: #ff6b6b;
      --syn-keyword: #c586c0;
      --syn-comment: #6a9955;
      --syn-string: #ce9178;
      --syn-number: #b5cea8;
      --syn-function: #dcdcaa;
      --syn-type: #4ec9b0;
      --syn-definition: #9cdcfe;
      --syn-property: #9cdcfe;
      --syn-punctuation: #a0a0a0;
      --syn-meta: #569cd6;
      --send: #fff;
      --send-ink: #111;
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg: #fff;
      --panel: #f6f6f6;
      --ink: #111;
      --muted: #5c5c5c;
      --line: #e3e3e3;
      --you: #0b63e5;
      --field: #fff;
      --hover: #ececec;
      --danger: #c62828;
      --syn-keyword: #af00db;
      --syn-comment: #008000;
      --syn-string: #a31515;
      --syn-number: #098658;
      --syn-function: #795e26;
      --syn-type: #267f99;
      --syn-definition: #001080;
      --syn-property: #001080;
      --syn-punctuation: #555555;
      --syn-meta: #0000ff;
      --send: #111;
      --send-ink: #fff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      font-family: Aptos, "Segoe UI Variable Text", "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      background-color: var(--bg);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    button, select, textarea { font: inherit; color: inherit; }
    button:focus-visible, select:focus-visible {
      outline: 2px solid var(--you);
      outline-offset: 2px;
    }

    #sidebar {
      flex: none;
      width: 16.5rem;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }
    #sidebar[inert] { opacity: 0.55; }
    body.sidebar-closed #sidebar { display: none; }
    .side-top { padding: 0.85rem 0.75rem 0.5rem; }
    #new-chat {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }
    #new-chat:hover { background: var(--hover); }
    #new-chat svg { width: 1.05rem; height: 1.05rem; }
    .side-label {
      margin: 0.6rem 0.75rem 0.3rem 1rem;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    #chats {
      flex: 1;
      margin: 0;
      padding: 0 0.5rem 0.75rem;
      overflow: auto;
      list-style: none;
    }
    .chat-row {
      position: relative;
      display: flex;
      align-items: center;
      border-radius: 10px;
    }
    .chat-row:hover, .chat-row:focus-within { background: var(--hover); }
    .chat-row.active { background: var(--hover); }
    .chat-open {
      flex: 1;
      min-width: 0;
      padding: 0.5rem 0.75rem;
      border: 0;
      border-radius: 10px;
      background: transparent;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .chat-row.active .chat-open { font-weight: 600; }
    .chat-rename-input {
      flex: 1;
      min-width: 0;
      margin: 0.2rem 0.4rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--accent, #3b82f6);
      border-radius: 8px;
      background: transparent;
      color: inherit;
      font: inherit;
    }
    .chat-open .pin-mark {
      display: inline-block;
      width: 0.8rem;
      height: 0.8rem;
      margin-right: 0.4rem;
      vertical-align: -0.1rem;
      color: var(--muted);
    }
    .chat-open .in-folder { margin-left: 0.5rem; color: var(--muted); font-size: 0.75rem; font-weight: 400; }
    .chat-more {
      flex: none;
      display: none;
      margin-right: 0.3rem;
      padding: 0.25rem 0.35rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .chat-more svg { display: block; width: 1.1rem; height: 1.1rem; }
    .chat-row:hover .chat-more,
    .chat-row:focus-within .chat-more,
    .folder-row:hover .chat-more,
    .folder-row:focus-within .chat-more,
    .chat-more[aria-expanded="true"] { display: block; }
    .chat-more:hover, .chat-more[aria-expanded="true"] { color: var(--ink); }
    .side-group {
      margin: 0.7rem 0.5rem 0.25rem;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .folder-head {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      width: 100%;
      margin-top: 0.15rem;
      padding: 0.45rem 0.6rem;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--ink);
      font-weight: 600;
      text-align: left;
      cursor: pointer;
    }
    .folder-row { display: flex; align-items: center; border-radius: 10px; }
    .folder-row:hover, .folder-row:focus-within { background: var(--hover); }
    .folder-row .folder-head { flex: 1; min-width: 0; width: auto; }
    .folder-head svg { flex: none; width: 1rem; height: 1rem; color: var(--muted); }
    .folder-head .chevron { transition: transform 0.12s; }
    .folder-head[aria-expanded="false"] .chevron { transform: rotate(-90deg); }
    .folder-head .folder-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .folder-head .count { color: var(--muted); font-size: 0.75rem; font-weight: 400; }
    .folder-chats { margin: 0 0 0 0.9rem; padding: 0; list-style: none; border-left: 1px solid var(--line); }
    #chat-menu {
      position: fixed;
      z-index: 20;
      min-width: 12.5rem;
      max-width: 16rem;
      padding: 0.3rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
    }
    #chat-menu[hidden] { display: none; }
    #chat-menu button, #chat-menu input {
      display: block;
      width: 100%;
      padding: 0.45rem 0.65rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      font: inherit;
      text-align: left;
    }
    #chat-menu button { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #chat-menu button:hover, #chat-menu button:focus-visible { background: var(--hover); outline: 0; }
    #chat-menu input { border: 1px solid var(--line); margin-top: 0.2rem; }
    #chat-menu .danger { color: var(--danger); }
    #chat-menu .menu-note { padding: 0.3rem 0.65rem; color: var(--muted); font-size: 0.75rem; }
    #chat-menu hr { margin: 0.25rem 0; border: 0; border-top: 1px solid var(--line); }
    .side-empty { margin: 0.5rem 0.5rem; padding: 0 0.5rem; color: var(--muted); font-size: 0.88rem; }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .head-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
    h1 {
      margin: 0;
      font-family: Aptos Display, Aptos, "Segoe UI Variable Display", "Segoe UI", sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    #status {
      margin: 0.1rem 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .icon-button {
      display: grid;
      place-items: center;
      flex: none;
      width: 2.2rem;
      height: 2.2rem;
      padding: 0;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .icon-button:hover { background: var(--hover); color: var(--ink); }
    .icon-button svg { width: 1.25rem; height: 1.25rem; }

    #log {
      flex: 1;
      overflow: auto;
      padding: 1.5rem max(1.25rem, calc(50% - 31rem)) 1rem;
    }
    .empty {
      max-width: 34rem;
      margin: 18vh auto 0;
      color: var(--muted);
      text-align: center;
    }
    .empty strong {
      display: block;
      margin-bottom: 0.6rem;
      color: var(--ink);
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.25;
    }
    .empty strong { text-wrap: balance; }
    .empty .hint { display: block; margin-bottom: 0.5rem; text-wrap: balance; }
    .empty .keys { display: block; font-size: 0.82rem; opacity: 0.75; }
    .turn {
      margin: 0 0 0.85rem;
      padding: 0.8rem 1rem;
      border-radius: 16px;
      white-space: pre-wrap;
    }
    .turn.user {
      width: fit-content;
      max-width: 85%;
      margin-left: auto;
      background: var(--you);
      color: #fff;
    }
    .turn.user .who { color: rgba(255, 255, 255, 0.75); }
    .turn.assistant {
      padding-left: 0.15rem;
      padding-right: 0.15rem;
    }
    .thinking {
      margin-bottom: 0.6rem;
      padding-left: 0.7rem;
      border-left: 2px solid var(--line);
      color: var(--muted);
      font-size: 0.92em;
    }
    .who {
      display: block;
      margin-bottom: 0.2rem;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .composer {
      padding: 0.5rem max(1.25rem, calc(50% - 31rem)) 1.1rem;
    }
    .box {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 0.7rem 0.7rem 0.6rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--field);
    }
    .box:focus-within { border-color: var(--you); }
    textarea {
      width: 100%;
      min-height: 2.9rem;
      max-height: 10rem;
      padding: 0;
      border: 0;
      outline: 0;
      resize: none;
      background: transparent;
      line-height: 1.45;
    }
    textarea::placeholder { color: var(--muted); }
    .notice {
      margin-bottom: 0.5rem;
      padding: 0.5rem 0.8rem;
      border: 1px solid var(--you);
      border-radius: 12px;
      background: var(--field);
      font-size: 0.88rem;
    }
    .notice[hidden] { display: none; }
    body.dragging .box { border-color: var(--you); border-style: dashed; box-shadow: 0 0 0 3px color-mix(in srgb, var(--you) 35%, transparent); }
    body.dragging .box::after {
      content: "Drop files to attach";
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .chips:empty { display: none; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      max-width: 14rem;
      padding: 0.2rem 0.3rem 0.2rem 0.6rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip button {
      padding: 0 0.3rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: inherit;
      font-size: 1rem;
      line-height: 1.2;
      cursor: pointer;
    }
    .chip button:hover { color: var(--ink); }
    .turn .chips { margin-bottom: 0.4rem; }
    .turn.user .chip { border-color: rgba(255, 255, 255, 0.4); color: #fff; padding-right: 0.6rem; }
    .box-left { display: flex; align-items: center; gap: 0.2rem; min-width: 0; }
    #attach:disabled { opacity: 0.5; cursor: default; }
    .box-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    #model {
      min-width: 9.5rem;
      max-width: 100%;
      text-overflow: ellipsis;
      padding: 0.3rem 0.5rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 0.88rem;
      cursor: pointer;
    }
    #model:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
    #model:disabled { cursor: default; opacity: 0.6; }
    #send {
      display: grid;
      place-items: center;
      width: 2.1rem;
      height: 2.1rem;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: var(--send);
      color: var(--send-ink);
      cursor: pointer;
    }
    #send svg { width: 1.05rem; height: 1.05rem; }
    #send .stop-icon { display: none; }
    #send.stop .send-icon { display: none; }
    #send.stop .stop-icon { display: block; }

    body.has-bg header,
    body.has-bg #sidebar { background: color-mix(in srgb, var(--panel) 88%, transparent); }
    body.has-bg .turn.assistant {
      padding: 0.8rem 1rem;
      background: color-mix(in srgb, var(--panel) 82%, transparent);
    }

    .tabs { display: flex; gap: 0.15rem; padding: 0.15rem; border: 1px solid var(--line); border-radius: 11px; }
    .tab {
      padding: 0.2rem 0.85rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { background: var(--hover); color: var(--ink); }

    .work { flex: 1; min-height: 0; display: flex; }
    #chat-pane { position: relative; flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    #pane-resize { display: none; }
    body.view-files #pane-resize {
      display: block;
      position: absolute;
      z-index: 4;
      top: 0;
      bottom: 0;
      left: -4px;
      width: 9px;
      cursor: col-resize;
      touch-action: none;
    }
    #pane-resize::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 4px;
      width: 2px;
      background: transparent;
      transition: background 0.12s;
    }
    #pane-resize:hover::after, #pane-resize:focus-visible::after, body.resizing #pane-resize::after { background: var(--you); }
    #pane-resize:focus-visible { outline: none; }
    body.resizing { cursor: col-resize; user-select: none; }
    body.resizing iframe, body.resizing textarea { pointer-events: none; }
    body.files-hidden .file-side { display: none; }
    #files { display: none; flex: 1; min-width: 0; min-height: 0; flex-direction: column; gap: 0.5rem; padding: 0.9rem 1.1rem 1.1rem; }
    body.view-files #files { display: flex; }
    body.view-files #chat-pane {
      flex: none;
      width: var(--pane-w, min(30rem, 40%));
      min-width: 20rem;
      max-width: 75%;
      border-left: 1px solid var(--line);
    }
    body.view-files #sidebar { display: none; }
    body.view-files #toggle-sidebar { visibility: hidden; }
    body.view-files .empty { margin-top: 6vh; }
    body.view-files .empty strong { font-size: 1.2rem; }
    .folder-bar { display: flex; align-items: center; gap: 0.6rem; }
    #folder-label { min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
    .folder-bar .choice, .editor-bar .choice { flex: none; padding: 0.4rem 0.9rem; }
    .file-side { flex: none; width: 13rem; min-height: 0; display: flex; flex-direction: column; gap: 0.4rem; }
    input[type="search"], #browse-input {
      width: 100%;
      padding: 0.45rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-size: 0.9rem;
    }
    input[type="search"]:focus-visible, #browse-input:focus-visible { outline: 2px solid var(--you); outline-offset: 1px; }
    #folder-dialog { width: min(34rem, calc(100% - 2rem)); }
    .local-pick { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .local-pick .choice { flex: 1 1 12rem; }
    .local-pick .choice[hidden] { display: none; }
    .rule { margin: 0.9rem 0 0.2rem; border: 0; border-top: 1px solid var(--line); }
    #browse-lead { margin: 0.2rem 0 0.5rem; }
    .browse-path { margin: 0.6rem 0 0.3rem; color: var(--muted); font-size: 0.82rem; overflow-wrap: anywhere; }
    #browse-list {
      height: 16rem;
      margin: 0 0 0.4rem;
      padding: 0.3rem;
      overflow: auto;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    #browse-list button {
      display: block;
      width: 100%;
      padding: 0.35rem 0.6rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      overflow-wrap: anywhere;
      cursor: pointer;
    }
    #browse-list button:hover, #browse-list button:focus-visible { background: var(--hover); }
    #browse-list .up { color: var(--muted); }
    #folder-dialog .choices { margin-top: 0.6rem; }
    #files .note { margin: 0; min-height: 1.3rem; }
    .files-body { flex: 1; min-height: 0; display: flex; gap: 0.75rem; }
    #file-list {
      flex: 1;
      min-height: 0;
      margin: 0;
      padding: 0.35rem;
      overflow: auto;
      list-style: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
    }
    #file-list button {
      display: block;
      width: 100%;
      padding: 0.3rem 0.55rem;
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
      font-size: 0.88rem;
      overflow-wrap: anywhere;
      cursor: pointer;
    }
    #file-list button:hover { background: var(--hover); }
    #file-list button[aria-current="true"] { background: var(--hover); font-weight: 600; }
    .editor { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.4rem; }
    .editor-bar { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    #file-title { flex: 1; min-width: 8rem; font-weight: 600; font-size: 0.92rem; overflow-wrap: anywhere; }
    /* The editor (CodeMirror) fills this box. Its own look is set in the bundle,
       from the page's colour variables. */
    #file-text { position: relative; flex: 1; min-height: 8rem; min-width: 0; }
    #file-text .cm-editor { position: absolute; inset: 0; }
    #file-text:empty {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      opacity: 0.6;
    }
    #conflict { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    #conflict[hidden] { display: none; }
    #conflict .choice { flex: none; padding: 0.3rem 0.8rem; }
    @media (max-width: 900px) {
      body.view-files .work { flex-direction: column; overflow: auto; }
      body.view-files #files { flex: none; min-height: 30rem; }
      body.view-files #chat-pane { flex: none; width: auto; min-width: 0; max-width: none; height: 34rem; border-left: 0; border-top: 1px solid var(--line); }
      body.view-files #pane-resize { display: none; }
      .files-body { flex-direction: column; }
      .file-side { width: auto; max-height: 9rem; }
    }

    @media (max-width: 720px) {
      #sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 5;
        width: min(17rem, 85%);
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      }
    }

    dialog {
      width: min(24rem, calc(100% - 2rem));
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      color: var(--ink);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
    .dialog-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1rem 0.4rem 1.25rem;
    }
    .dialog-head h2 { margin: 0; font-size: 1rem; font-weight: 600; }
    .dialog-body { padding: 0.25rem 1.25rem 1.25rem; }
    .setting { margin-top: 1rem; }
    .setting-label {
      display: block;
      margin-bottom: 0.4rem;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      cursor: pointer;
    }
    .switch-row .setting-label { margin: 0; cursor: inherit; }
    .switch {
      position: relative;
      flex: none;
      width: 2.4rem;
      height: 1.4rem;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--field);
      appearance: none;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0.17rem;
      width: 1rem;
      height: 1rem;
      border-radius: 50%;
      background: var(--muted);
      transform: translateY(-50%);
      transition: left 0.12s, background 0.12s;
    }
    .switch:checked { border-color: var(--you); background: var(--you); }
    .switch:checked::after { left: calc(100% - 1.17rem); background: #fff; }
    .switch:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
    .choices { display: flex; gap: 0.5rem; }
    .choice {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
    }
    .choice[aria-pressed="true"] { border-color: var(--you); background: var(--hover); }
    .choice:disabled { opacity: 0.4; cursor: default; }
    .note { margin: 0.5rem 0 0; color: var(--muted); font-size: 0.82rem; }
  </style>
</head>

  <script>
    const modelSelect = document.querySelector("#model");
    const messageBox = document.querySelector("#message");
    const sendButton = document.querySelector("#send");
    const status = document.querySelector("#status");
    const log = document.querySelector("#log");
    const sidebar = document.querySelector("#sidebar");
    const chatList = document.querySelector("#chats");
    const settings = document.querySelector("#settings");
    const bgNote = document.querySelector("#bg-note");
    const narrow = window.matchMedia("(max-width: 720px)");

    let messages = [];
    let chatId = null;
    let chats = [];
    let activeRequest = null;

    function plainError(message) {
      if (message.includes("not reachable")) return "Ollama is not running.";
      return message;
    }

    function scrollLog() {
      log.scrollTop = log.scrollHeight;
    }

    function showEmpty() {
      const empty = document.createElement("p");
      empty.className = "empty";
      empty.id = "empty";
      const title = document.createElement("strong");
      title.id = "welcome-title";
      title.textContent = welcomeLine();
      const hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = "Ask a question, paste some code, or drop in a file, PDF, or picture.";
      const keys = document.createElement("span");
      keys.className = "keys";
      keys.textContent = "Enter sends. Shift+Enter starts a new line.";
      empty.append(title, hint, keys);
      log.replaceChildren(empty);
    }

    // By the clock on this computer: morning 5:00-11:59, afternoon 12:00-16:59,
    // evening 17:00-23:59, and "Late one" in the small hours (0:00-4:59).
    function greeting(now = new Date()) {
      const hour = now.getHours();
      if (hour >= 5 && hour < 12) return "Good morning";
      if (hour >= 12 && hour < 17) return "Good afternoon";
      if (hour >= 17) return "Good evening";
      return "Late one";
    }

    function welcomeLine(now = new Date()) {
      return greeting(now) + ", what are we working on?";
    }

    // A tab left open keeps its old greeting, so check again now and then
    // and whenever the user comes back to it.
    function refreshWelcome() {
      const title = document.querySelector("#welcome-title");
      if (title && title.textContent !== welcomeLine()) title.textContent = welcomeLine();
    }
    setInterval(refreshWelcome, 60_000);
    window.addEventListener("focus", refreshWelcome);
    document.addEventListener("visibilitychange", refreshWelcome);

    const MAX_FILE = 500_000;
    const MAX_FILES_TOTAL = 2_000_000;
    const MAX_IMAGE = 10_000_000;
    const MAX_IMAGES_TOTAL = 30_000_000;
    const MAX_OFFICE = 50_000_000;
    const MAX_PDF = 50_000_000;
    const MAX_PDF_PAGES = 25;
    const PDF_IMAGE_PAGES = 4;
    const IMAGE_TYPES = ["image/png", "image/jpeg", "image/webp", "image/gif"];
    const chips = document.querySelector("#chips");
    const fileInput = document.querySelector("#file-input");
    const attachButton = document.querySelector("#attach");
    let attached = [];

    function renderChips() {
      chips.replaceChildren();
      attached.forEach((file, index) => {
        const chip = document.createElement("div");
        chip.className = "chip";
        const name = document.createElement("span");
        name.textContent = file.name;
        name.title = file.name;
        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "×";
        remove.setAttribute("aria-label", "Remove " + file.name);
        remove.addEventListener("click", () => {
          attached.splice(index, 1);
          renderChips();
          saveDraft(draftKey(), true);
        });
        chip.append(name, remove);
        chips.append(chip);
      });
    }

    async function addFiles(list) {
      let total = attached.reduce((sum, file) => sum + (file.text || "").length, 0);
      const problems = [];
      let images = attached.filter((item) => item.image).length;
      let imageBytes = attached.reduce((sum, item) => sum + (item.image ? item.image.length : 0), 0);
      let switched = "";
      const addImage = async (name, size, getData) => {
        const vision = visionModel();
        if (!vision) {
          problems.push(name + " needs a Gemma model, and none is installed in Ollama");
          return false;
        }
        if (size > MAX_IMAGE) {
          problems.push(name + " is over 10 MB");
          return false;
        }
        if (imageBytes + size > MAX_IMAGES_TOTAL) {
          problems.push(name + " would make the pictures too big for one message");
          return false;
        }
        attached.push({ name, image: await getData() });
        imageBytes += size;
        images += 1;
        if (modelSelect.value !== vision) {
          modelSelect.value = vision;
          switched = vision;
        }
        return true;
      };
      // Add text to the message. Too long for one file or for the message:
      // cut at a line break and say so.
      const addText = (name, text, cut) => {
        if (text.length > MAX_FILE) {
          text = text.slice(0, MAX_FILE);
          cut = true;
        }
        const room = MAX_FILES_TOTAL - total;
        if (room < 200) {
          problems.push(name + " would make the files too big");
          return;
        }
        if (text.length > room) {
          text = text.slice(0, room);
          cut = true;
        }
        if (cut) {
          const lastBreak = text.lastIndexOf("\n");
          if (lastBreak > 0) text = text.slice(0, lastBreak);
          text += "\n[cut here: this is longer than one message can hold]";
          problems.push(name + " was cut to its first " + (text.split("\n").length - 1) + " lines");
        }
        total += text.length;
        attached.push({ name, text });
      };
      for (const file of list) {
        if (inCodeView() && (IMAGE_TYPES.includes(file.type) || /\.(pdf|docx|xlsx)$/i.test(file.name) || file.type === "application/pdf")) {
          problems.push(file.name + " was not attached: the code editor takes text and code files only. Pictures and PDFs go in the Chat tab");
          continue;
        }
        if (IMAGE_TYPES.includes(file.type)) {
          await addImage(file.name, file.size, () => readBase64(file));
          continue;
        }
        if (file.type === "application/pdf" || /\.pdf$/i.test(file.name)) {
          if (file.size > MAX_PDF) {
            problems.push(file.name + " is over 50 MB");
            continue;
          }
          let pdf;
          try {
            pdf = await readPdf(file);
          } catch (error) {
            problems.push(file.name + " could not be read as a PDF");
            continue;
          }
          if (pdf.text.trim().length >= 40) {
            if (pdf.pages > MAX_PDF_PAGES) {
              problems.push(file.name + " has " + pdf.pages + " pages; only the first " + MAX_PDF_PAGES + " were read");
            }
            addText(file.name, pdf.text, false);
          } else {
            // Scanned PDF: no text inside, so Gemma reads the first pages as pictures.
            const shown = Math.min(pdf.pages, PDF_IMAGE_PAGES);
            let added = 0;
            for (let page = 1; page <= shown; page += 1) {
              const png = await pdf.renderPage(page);
              if (!(await addImage(file.name + " p" + page, png.length, async () => png))) break;
              added += 1;
            }
            if (added && pdf.pages > shown) {
              problems.push(file.name + " is scanned; only the first " + shown + " of " + pdf.pages + " pages were attached");
            }
          }
          pdf.close();
          continue;
        }
        if (/\.(docx|xlsx)$/i.test(file.name)) {
          if (file.size > MAX_OFFICE) {
            problems.push(file.name + " is over 50 MB");
            continue;
          }
          try {
            const text = /\.docx$/i.test(file.name) ? await readDocx(file) : await readXlsx(file);
            if (!text.trim()) problems.push(file.name + " has no text in it");
            else addText(file.name, text, false);
          } catch (error) {
            problems.push(file.name + " could not be read (" + error.message + ")");
          }
          continue;
        }
        if (/\.(doc|xls|ppt|pptx|odt|ods)$/i.test(file.name)) {
          problems.push(file.name + " is not supported; save it as .docx or .xlsx, or export it to text");
          continue;
        }
        if (!isTextKind(file.name)) {
          problems.push(file.name + " is not a supported file type");
          continue;
        }
        // Plain text, markdown, code, csv, tsv. A long one is cut at a line break, not refused.
        const head = new Uint8Array(await file.slice(0, MAX_FILE + 4).arrayBuffer());
        const text = decodeText(head, file.size > head.length);
        if (text === null) {
          problems.push(file.name + " is not a text file");
          continue;
        }
        addText(file.name, text, file.size > head.length);
      }
      renderChips();
      const notes = [];
      if (switched) notes.push("Switched to " + switched + " because you attached a picture.");
      if (problems.length) notes.push("Heads up: " + problems.join("; ") + ".");
      status.textContent = notes.join(" ");
      saveDraft(draftKey(), true);
      if (switched) notify("Switched to " + switched + " to read your image.");
    }

    // .docx and .xlsx are zip files of XML. The browser can inflate zip data
    // itself (DecompressionStream), so this needs no library: find the entries
    // in the zip's central directory and inflate only the ones we read.
    const MAX_INFLATED = 100_000_000;

    async function openZip(file) {
      const tail = new Uint8Array(await file.slice(Math.max(0, file.size - 70_000)).arrayBuffer());
      const tailView = new DataView(tail.buffer);
      let end = -1;
      for (let i = tail.length - 22; i >= 0; i -= 1) {
        if (tailView.getUint32(i, true) === 0x06054b50) { end = i; break; }
      }
      if (end < 0) throw new Error("not a zip file");
      const count = tailView.getUint16(end + 10, true);
      const dirSize = tailView.getUint32(end + 12, true);
      const dirStart = tailView.getUint32(end + 16, true);
      if (dirStart === 0xffffffff || count === 0xffff) throw new Error("zip is too large");
      const dir = new Uint8Array(await file.slice(dirStart, dirStart + dirSize).arrayBuffer());
      const view = new DataView(dir.buffer);
      const entries = new Map();
      let at = 0;
      for (let n = 0; n < count && at + 46 <= dir.length; n += 1) {
        if (view.getUint32(at, true) !== 0x02014b50) break;
        const nameLength = view.getUint16(at + 28, true);
        const extraLength = view.getUint16(at + 30, true);
        const commentLength = view.getUint16(at + 32, true);
        entries.set(new TextDecoder().decode(dir.subarray(at + 46, at + 46 + nameLength)), {
          method: view.getUint16(at + 10, true),
          size: view.getUint32(at + 20, true),
          offset: view.getUint32(at + 42, true),
        });
        at += 46 + nameLength + extraLength + commentLength;
      }
      return {
        has: (name) => entries.has(name),
        names: () => [...entries.keys()],
        async text(name) {
          const entry = entries.get(name);
          if (!entry) return null;
          const header = new DataView(await file.slice(entry.offset, entry.offset + 30).arrayBuffer());
          const start = entry.offset + 30 + header.getUint16(26, true) + header.getUint16(28, true);
          const raw = file.slice(start, start + entry.size);
          if (entry.method === 0) return new TextDecoder().decode(await raw.arrayBuffer());
          if (entry.method !== 8) throw new Error("unsupported zip compression");
          const stream = raw.stream().pipeThrough(new DecompressionStream("deflate-raw"));
          const reader = stream.getReader();
          const decoder = new TextDecoder();
          let out = "";
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            out += decoder.decode(value, { stream: true });
            if (out.length > MAX_INFLATED) {
              reader.cancel();
              throw new Error("file expands too much");
            }
          }
          return out + decoder.decode();
        },
      };
    }

    function parseXml(text) {
      const doc = new DOMParser().parseFromString(text, "application/xml");
      if (doc.querySelector("parsererror")) throw new Error("damaged XML");
      return doc;
    }

    const localName = (node) => node.localName;
    const children = (node, name) => [...node.children].filter((child) => localName(child) === name);

    async function readDocx(file) {
      const zip = await openZip(file);
      const body = await zip.text("word/document.xml");
      if (body === null) throw new Error("no document.xml");
      const root = parseXml(body).getElementsByTagNameNS("*", "body")[0];
      const paragraph = (node) => {
        let out = "";
        const walk = (item) => {
          for (const child of item.children) {
            const name = localName(child);
            if (name === "t") out += child.textContent;
            else if (name === "tab") out += "\t";
            else if (name === "br" || name === "cr") out += "\n";
            else if (name !== "instrText") walk(child);
          }
        };
        walk(node);
        return out;
      };
      const lines = [];
      const block = (node) => {
        for (const child of node.children) {
          const name = localName(child);
          if (name === "p") lines.push(paragraph(child));
          else if (name === "tbl") {
            for (const row of children(child, "tr")) {
              lines.push(children(row, "tc").map((cell) =>
                children(cell, "p").map(paragraph).join(" ")).join("\t"));
            }
            lines.push("");
          } else if (name === "sdt" || name === "customXml") {
            for (const inner of child.children) if (localName(inner) === "sdtContent") block(inner);
          }
        }
      };
      block(root);
      return lines.join("\n").replace(/\n{3,}/g, "\n\n").trim();
    }

    function columnNumber(reference) {
      let n = 0;
      for (const ch of reference.replace(/[0-9]/g, "")) n = n * 26 + ch.charCodeAt(0) - 64;
      return n - 1;
    }

    async function readXlsx(file) {
      const zip = await openZip(file);
      const book = await zip.text("xl/workbook.xml");
      if (book === null) throw new Error("no workbook.xml");
      const rels = {};
      const relText = await zip.text("xl/_rels/workbook.xml.rels");
      if (relText) {
        for (const rel of parseXml(relText).getElementsByTagName("Relationship")) {
          rels[rel.getAttribute("Id")] = rel.getAttribute("Target");
        }
      }
      const shared = [];
      const sharedText = await zip.text("xl/sharedStrings.xml");
      if (sharedText) {
        for (const item of parseXml(sharedText).getElementsByTagNameNS("*", "si")) {
          // Skip phonetic runs (rPh); keep ordinary and rich-text runs.
          let value = "";
          for (const t of item.getElementsByTagNameNS("*", "t")) {
            if (localName(t.parentNode) !== "rPh") value += t.textContent;
          }
          shared.push(value);
        }
      }
      const parts = [];
      const sheets = [...parseXml(book).getElementsByTagNameNS("*", "sheet")];
      for (const [index, sheet] of sheets.entries()) {
        const id = sheet.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
        let target = rels[id] || "worksheets/sheet" + (index + 1) + ".xml";
        target = target.startsWith("/") ? target.slice(1) : "xl/" + target;
        const xml = await zip.text(target);
        if (xml === null) continue;
        const rows = [];
        for (const row of parseXml(xml).getElementsByTagNameNS("*", "row")) {
          const cells = [];
          let next = 0;
          for (const cell of children(row, "c")) {
            const reference = cell.getAttribute("r");
            const column = reference ? columnNumber(reference) : next;
            const type = cell.getAttribute("t");
            const valueNode = children(cell, "v")[0];
            let value = "";
            if (type === "inlineStr") value = [...cell.getElementsByTagNameNS("*", "t")].map((t) => t.textContent).join("");
            else if (valueNode) {
              value = valueNode.textContent;
              if (type === "s") value = shared[Number(value)] ?? "";
              else if (type === "b") value = value === "1" ? "TRUE" : "FALSE";
            }
            while (cells.length < column) cells.push("");
            cells[column] = value.replace(/[\t\r\n]+/g, " ");
            next = column + 1;
          }
          rows.push(cells.join("\t").replace(/\t+$/, ""));
        }
        while (rows.length && !rows[rows.length - 1]) rows.pop();
        if (rows.length) parts.push((sheets.length > 1 ? "--- sheet: " + sheet.getAttribute("name") + " ---\n" : "") + rows.join("\n"));
      }
      return parts.join("\n\n");
    }

    // Plain-text kinds the page accepts: notes, data, and everyday code.
    // Anything else (.asm, model files, archives...) is refused, even if it
    // happens to be readable text.
    const TEXT_EXTENSIONS = new Set([
      "txt", "md", "markdown", "rst", "log", "csv", "tsv",
      "json", "jsonl", "yaml", "yml", "toml", "ini", "cfg", "xml", "html", "htm", "css",
      "py", "r", "rmd", "c", "h", "cpp", "cc", "cxx", "hpp", "hh",
      "java", "kt", "go", "rs", "rb", "php", "swift", "cs", "scala", "lua", "pl",
      "js", "mjs", "ts", "jsx", "tsx", "sh", "bash", "sql", "tex",
    ]);
    const TEXT_NAMES = new Set(["makefile", "dockerfile", "readme", "license", "cmakelists.txt"]);

    function isTextKind(name) {
      const lower = name.toLowerCase();
      if (TEXT_NAMES.has(lower)) return true;
      const dot = lower.lastIndexOf(".");
      return dot > 0 || (dot === 0 && lower.length > 1) ? TEXT_EXTENSIONS.has(lower.slice(dot + 1)) : false;
    }

    // Read bytes as text. Honours a byte-order mark (Excel writes UTF-16 and
    // UTF-8 BOMs), tries UTF-8, then falls back to Windows-1252, which is what
    // older CSV exports use. Returns null for binary data.
    function decodeText(bytes, truncated) {
      if (bytes.includes(0)) {
        if (bytes[0] === 0xff && bytes[1] === 0xfe) return new TextDecoder("utf-16le").decode(bytes.subarray(2));
        if (bytes[0] === 0xfe && bytes[1] === 0xff) return new TextDecoder("utf-16be").decode(bytes.subarray(2));
        return null;
      }
      if (bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) bytes = bytes.subarray(3);
      try {
        return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
      } catch (error) {
        // A multi-byte character may be split by the cut; trim up to 3 bytes and retry.
        for (let trim = 1; truncated && trim <= 3; trim += 1) {
          try {
            return new TextDecoder("utf-8", { fatal: true }).decode(bytes.subarray(0, bytes.length - trim));
          } catch (inner) { /* keep trimming */ }
        }
      }
      const text = new TextDecoder("windows-1252").decode(bytes);
      // Control characters other than tab, newline, return mean binary, not text.
      return /[\u0001-\u0008\u000e-\u001f]/.test(text) ? null : text;
    }

    // pdf.js is bundled in web/vendor and loaded only when a PDF is attached.
    let pdfjs = null;
    async function readPdf(file) {
      if (!pdfjs) {
        pdfjs = await import("/vendor/pdf.min.mjs");
        pdfjs.GlobalWorkerOptions.workerSrc = "/vendor/pdf.worker.min.mjs";
      }
      const doc = await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
      let text = "";
      const limit = Math.min(doc.numPages, MAX_PDF_PAGES);
      for (let number = 1; number <= limit && text.length < MAX_FILES_TOTAL; number += 1) {
        const page = await doc.getPage(number);
        const content = await page.getTextContent();
        let line = "";
        for (const item of content.items) {
          line += item.str;
          if (item.hasEOL) line += "\n";
          else if (item.str && !line.endsWith(" ")) line += " ";
        }
        text += (limit > 1 ? "\n--- page " + number + " ---\n" : "") + line.replace(/[ \t]+\n/g, "\n").trim() + "\n";
      }
      return {
        text,
        pages: doc.numPages,
        close: () => doc.destroy(),
        async renderPage(number) {
          const page = await doc.getPage(number);
          const viewport = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement("canvas");
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
          return canvas.toDataURL("image/png").split(",", 2)[1];
        },
      };
    }

    let noticeTimer = null;
    function notify(text) {
      const notice = document.querySelector("#notice");
      notice.textContent = text;
      notice.hidden = false;
      clearTimeout(noticeTimer);
      noticeTimer = setTimeout(() => { notice.hidden = true; }, 6000);
    }

    function visionModel() {
      const names = [...modelSelect.options].map((option) => option.value).filter(Boolean);
      if (isVision(modelSelect.value)) return modelSelect.value;
      return names.find(isVision) || "";
    }

    function isVision(name) {
      return name.split(":", 1)[0].toLowerCase().startsWith("gemma3");
    }

    function readBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",", 2)[1] || "");
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    function withFiles(message) {
      const textFiles = (message.files || []).filter((file) => typeof file.text === "string");
      if (!textFiles.length) return message.content;
      const blocks = textFiles.map((file) => {
        let fence = "```";
        while (file.text.includes(fence)) fence += "`";
        return "File: " + file.name + "\n" + fence + "\n" + file.text + "\n" + fence;
      });
      return blocks.join("\n\n") + "\n\n" + message.content;
    }

    function addTurn(role, text, thought, files) {
      document.querySelector("#empty")?.remove();
      const block = document.createElement("article");
      block.className = "turn " + role;
      const who = document.createElement("span");
      who.className = "who";
      who.textContent = role === "user" ? "You" : "Model";
      const thinking = document.createElement("div");
      thinking.className = "thinking";
      thinking.textContent = thought || "";
      thinking.hidden = !thought;
      const answer = document.createElement("div");
      answer.textContent = text;
      block.append(who, thinking, answer);
      if (files?.length) {
        const row = document.createElement("div");
        row.className = "chips";
        for (const file of files) {
          const chip = document.createElement("div");
          chip.className = "chip";
          const name = document.createElement("span");
          name.textContent = file.name;
          chip.append(name);
          row.append(chip);
        }
        who.after(row);
      }
      if (role === "user") thinking.remove();
      log.append(block);
      scrollLog();
      return { block, thinking, answer };
    }

    function renderLog() {
      if (messages.length === 0) {
        showEmpty();
        return;
      }
      log.replaceChildren();
      for (const message of messages) addTurn(message.role, message.content, message.thinking, message.files);
    }

    function setBusy(busy) {
      sendButton.classList.toggle("stop", busy);
      sendButton.setAttribute("aria-label", busy ? "Stop" : "Send");
      messageBox.disabled = busy;
      attachButton.disabled = busy;
      if (busy) closeMenu();
      modelSelect.disabled = busy || !modelSelect.value;
      sidebar.toggleAttribute("inert", busy);
      document.dispatchEvent(new Event("busychange"));
    }

    async function refreshState() {
      const response = await fetch("/api/state");
      const body = await response.json();
      status.textContent = body.large_model
        ? "Kept loaded: " + body.large_model
        : "No large model loaded yet.";
    }

    async function loadModels() {
      let models = [];
      let problem = "";
      try {
        const response = await fetch("/api/tags");
        const body = await response.json();
        models = body.models || [];
        if (!response.ok) problem = plainError(body.error || "Could not list models.");
        else if (models.length === 0) problem = "No chat models installed in Ollama.";
      } catch (error) {
        problem = "The helper is not responding.";
      }
      allModels = models;
      fillModels(problem);
    }

    // The picker shows every chat model in Chat. In the code editor it shows
    // only text-only models, with coder models first, because the editor has
    // no pictures or PDFs to read.
    let allModels = [];
    let modelProblem = "";
    const CODE_MODEL_KEY = "lightusagi-model-code";
    const inCodeView = () => document.body.classList.contains("view-files");
    const looksVision = (name) =>
      /gemma3|llava|vision|minicpm-v|moondream|pixtral|mllama|qwen[\d.]*-?vl|[-_.:]vl\b/i.test(name);
    const codeRank = (name) => (/qwen.*coder|coder.*qwen/i.test(name) ? 0 : /code|devstral/i.test(name) ? 1 : 2);

    function modelsForView() {
      if (!inCodeView()) return allModels;
      return allModels
        .filter((name) => !looksVision(name))
        .map((name, index) => ({ name, index }))
        .sort((a, b) => codeRank(a.name) - codeRank(b.name) || a.index - b.index)
        .map((item) => item.name);
    }

    function fillModels(problem = modelProblem) {
      modelProblem = problem;
      const models = modelsForView();
      modelSelect.replaceChildren();
      if (models.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = allModels.length ? "No text-only model" : "No model selected";
        modelSelect.append(option);
        modelSelect.disabled = true;
        status.textContent = problem || (allModels.length
          ? "The code editor needs a text-only model, and the installed ones also read pictures."
          : "");
        return;
      }
      const saved = localStorage.getItem(inCodeView() ? CODE_MODEL_KEY : "lightusagi-model");
      for (const name of models) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        modelSelect.append(option);
      }
      modelSelect.value = models.includes(saved) ? saved : models[0];
      modelSelect.disabled = Boolean(activeRequest);
      refreshState();
    }

    function renderChats() {
      chatList.replaceChildren();
      if (chats.length === 0) {
        const none = document.createElement("li");
        none.className = "side-empty";
        none.textContent = "No chats yet.";
        chatList.append(none);
        return;
      }
      // Every chat shows in one place. Pinned chats come first, then folders
      // (the folder with the newest chat first), then the rest. Inside each
      // group the most recently used chat is on top, which is the order the
      // helper already returns.
      const pinned = chats.filter((chat) => chat.pinned);
      const unpinned = chats.filter((chat) => !chat.pinned);
      const folders = new Map();
      for (const chat of unpinned) {
        if (!chat.folder) continue;
        if (!folders.has(chat.folder)) folders.set(chat.folder, []);
        folders.get(chat.folder).push(chat);
      }
      const loose = unpinned.filter((chat) => !chat.folder);
      const label = (text) => {
        const item = document.createElement("li");
        item.className = "side-group";
        item.textContent = text;
        chatList.append(item);
      };
      if (pinned.length) {
        label("Pinned");
        for (const chat of pinned) chatList.append(chatRow(chat, true));
      }
      for (const [name, inside] of folders) {
        const open = !foldersClosed.has(name) || inside.some((chat) => chat.id === chatId);
        const item = document.createElement("li");
        const head = document.createElement("button");
        head.type = "button";
        head.className = "folder-head";
        head.setAttribute("aria-expanded", String(open));
        head.innerHTML = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
        const text = document.createElement("span");
        text.className = "folder-name";
        text.textContent = name;
        text.title = name;
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = String(inside.length);
        head.append(text, count);
        head.addEventListener("click", () => {
          if (foldersClosed.has(name)) foldersClosed.delete(name);
          else foldersClosed.add(name);
          localStorage.setItem(FOLDERS_CLOSED, JSON.stringify([...foldersClosed]));
          renderChats();
        });
        const headRow = document.createElement("div");
        headRow.className = "folder-row";
        const more = document.createElement("button");
        more.className = "chat-more";
        more.type = "button";
        more.setAttribute("aria-label", "Options for folder " + name);
        more.setAttribute("aria-haspopup", "menu");
        more.setAttribute("aria-expanded", "false");
        more.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>';
        more.addEventListener("click", (event) => {
          event.stopPropagation();
          if (menuFor === "folder:" + name) closeMenu(true);
          else openFolderMenu(name, headRow, more);
        });
        headRow.append(head, more);
        item.append(headRow);
        if (open) {
          const list = document.createElement("ul");
          list.className = "folder-chats";
          for (const chat of inside) list.append(chatRow(chat, false));
          item.append(list);
        }
        chatList.append(item);
      }
      if (loose.length) {
        if (pinned.length || folders.size) label("Chats");
        for (const chat of loose) chatList.append(chatRow(chat, false));
      }
    }

    const FOLDERS_CLOSED = "lightusagi-folders-closed";
    const foldersClosed = new Set(JSON.parse(localStorage.getItem(FOLDERS_CLOSED) || "[]"));
    const PIN_ICON = '<svg class="pin-mark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 3l7 7-2 1-3 3 .5 5-2 .5-3.5-3.5L6 21l-1-1 5.5-5.5L7 11l.5-2 5 .5 3-3z"/></svg>';

    function chatRow(chat, showFolder) {
      const row = document.createElement("li");
      row.className = "chat-row" + (chat.id === chatId ? " active" : "");
      const open = document.createElement("button");
      open.className = "chat-open";
      open.type = "button";
      open.title = chat.title;
      if (chat.pinned) open.insertAdjacentHTML("beforeend", PIN_ICON);
      open.append(chat.title);
      if (showFolder && chat.folder) {
        const where = document.createElement("span");
        where.className = "in-folder";
        where.textContent = chat.folder;
        open.append(where);
      }
      if (chat.id === chatId) open.setAttribute("aria-current", "true");
      open.addEventListener("click", () => openChat(chat.id));
      open.addEventListener("dblclick", () => startRename(chat, row));
      const more = document.createElement("button");
      more.className = "chat-more";
      more.type = "button";
      more.setAttribute("aria-label", "Options for " + chat.title);
      more.setAttribute("aria-haspopup", "menu");
      more.setAttribute("aria-expanded", "false");
      more.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>';
      more.addEventListener("click", (event) => {
        event.stopPropagation();
        if (menuFor === chat.id) closeMenu(true);
        else openMenu(chat, row, more);
      });
      row.append(open, more);
      return row;
    }

    // The options menu: pin, rename, move to a folder, delete.
    const menu = document.querySelector("#chat-menu");
    let menuFor = null;
    let menuButton = null;

    function closeMenu(returnFocus = false) {
      menu.hidden = true;
      menu.replaceChildren();
      menuButton?.setAttribute("aria-expanded", "false");
      if (returnFocus) menuButton?.focus();
      menuFor = null;
      menuButton = null;
    }

    function menuItem(text, onClick, className = "") {
      const item = document.createElement("button");
      item.type = "button";
      item.setAttribute("role", "menuitem");
      item.textContent = text;
      if (className) item.className = className;
      item.addEventListener("click", onClick);
      return item;
    }

    function placeMenu(button) {
      const box = button.getBoundingClientRect();
      menu.hidden = false;
      const width = menu.offsetWidth;
      const height = menu.offsetHeight;
      menu.style.left = Math.max(8, Math.min(box.right - width, window.innerWidth - width - 8)) + "px";
      const below = box.bottom + 4;
      menu.style.top = (below + height > window.innerHeight - 8 ? Math.max(8, box.top - height - 4) : below) + "px";
    }

    function openMenu(chat, row, button) {
      if (activeRequest) return;
      closeMenu();
      menuFor = chat.id;
      menuButton = button;
      button.setAttribute("aria-expanded", "true");
      showMainMenu(chat, row);
      placeMenu(button);
      menu.querySelector("button")?.focus();
    }

    function showMainMenu(chat, row) {
      menu.replaceChildren(
        menuItem(chat.pinned ? "Unpin" : "Pin to top", () => changeChat(chat.id, { pinned: !chat.pinned })),
        menuItem("Rename", () => {
          const target = row;
          closeMenu();
          startRename(chat, target);
        }),
        menuItem(chat.folder ? "Move to another folder…" : "Move to folder…", () => {
          showFolderMenu(chat, row);
          placeMenu(menuButton);
        }),
        document.createElement("hr"),
      );
      let armed = false;
      let timer = null;
      const remove = menuItem("Delete", () => {
        if (!armed) {
          armed = true;
          remove.textContent = "Click again to delete";
          timer = setTimeout(() => {
            armed = false;
            remove.textContent = "Delete";
          }, 3000);
          return;
        }
        clearTimeout(timer);
        closeMenu();
        deleteChat(chat.id);
      }, "danger");
      menu.append(remove);
    }

    function showFolderMenu(chat, row) {
      const names = [...new Set(chats.map((item) => item.folder).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      const back = menuItem("‹ Back", () => {
        showMainMenu(chat, row);
        placeMenu(menuButton);
      });
      const input = document.createElement("input");
      input.type = "text";
      input.maxLength = 40;
      input.placeholder = "New folder name";
      input.setAttribute("aria-label", "New folder name");
      input.addEventListener("keydown", (event) => {
        event.stopPropagation();
        if (event.key === "Enter" && input.value.trim()) changeChat(chat.id, { folder: input.value.trim() });
        else if (event.key === "Escape") closeMenu(true);
      });
      const items = [back, document.createElement("hr")];
      if (chat.folder) items.push(menuItem("No folder", () => changeChat(chat.id, { folder: null })));
      for (const name of names) {
        if (name === chat.folder) continue;
        items.push(menuItem(name, () => changeChat(chat.id, { folder: name })));
      }
      menu.replaceChildren(...items, input);
    }

    function openFolderMenu(name, headRow, button) {
      if (activeRequest) return;
      closeMenu();
      menuFor = "folder:" + name;
      menuButton = button;
      button.setAttribute("aria-expanded", "true");
      const inside = chats.filter((chat) => chat.folder === name).length;
      let armed = false;
      let timer = null;
      const remove = menuItem("Delete folder", () => {
        if (!armed) {
          armed = true;
          remove.textContent = "Click again. " + (inside === 1 ? "The chat stays." : "All " + inside + " chats stay.");
          timer = setTimeout(() => {
            armed = false;
            remove.textContent = "Delete folder";
          }, 4000);
          return;
        }
        clearTimeout(timer);
        changeFolder(name, null);
      }, "danger");
      menu.replaceChildren(
        menuItem("Rename folder", () => {
          closeMenu();
          startFolderRename(name, headRow);
        }),
        remove,
        Object.assign(document.createElement("p"), {
          className: "menu-note",
          textContent: "Deleting a folder keeps its " + (inside === 1 ? "chat" : "chats") + ".",
        }),
      );
      placeMenu(button);
      menu.querySelector("button")?.focus();
    }

    function startFolderRename(name, headRow) {
      const input = document.createElement("input");
      input.className = "chat-rename-input";
      input.type = "text";
      input.value = name;
      input.maxLength = 40;
      input.setAttribute("aria-label", "Folder name");
      headRow.replaceChildren(input);
      input.focus();
      input.select();
      let done = false;
      const finish = (commit) => {
        if (done) return;
        done = true;
        const next = input.value.trim();
        if (commit && next && next !== name) changeFolder(name, next);
        else renderChats();
      };
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") finish(true);
        else if (event.key === "Escape") finish(false);
      });
      input.addEventListener("blur", () => finish(true));
    }

    async function changeFolder(from, to) {
      closeMenu();
      const count = chats.filter((chat) => chat.folder === from).length;
      try {
        const response = await fetch("/api/folders", {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ from, to }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "change failed");
        foldersClosed.delete(from);
        localStorage.setItem(FOLDERS_CLOSED, JSON.stringify([...foldersClosed]));
        const plural = (n) => n + (n === 1 ? " chat" : " chats");
        if (!to) status.textContent = "Folder \u201c" + from + "\u201d deleted. " + plural(result.changed) + " kept, now outside any folder.";
        else if (chats.some((chat) => chat.folder === result.to && chat.folder !== from)) status.textContent = "Merged \u201c" + from + "\u201d into \u201c" + result.to + "\u201d.";
        else status.textContent = "Folder renamed to \u201c" + result.to + "\u201d.";
        if (result.failed) status.textContent += " " + plural(result.failed) + " could not be updated.";
        if (count === 0 && !result.changed) status.textContent = "That folder was already gone.";
      } catch (error) {
        status.textContent = "Could not change that folder: " + error.message;

    async function saveChat() {

        const response = await fetch("/api/chats/" + chatId, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: modelSelect.value,

    // Drafts. What is typed and attached but not sent is kept by the helper in
    // ~/.lightusagi/drafts, one per chat ("new" before a chat has started), so
    // a reload or a switch to another chat does not lose it. Requests go
    // through one queue so they land in the order they were made.
    const DRAFT_NEW = "new";
    const LAST_CHAT = "lightusagi-chat";
    let draftTimer = null;
    let draftQueue = Promise.resolve();
    const draftKey = () => chatId || DRAFT_NEW;

    function saveDraft(key = draftKey(), withFiles = false, keepalive = false) {
      clearTimeout(draftTimer);
      draftTimer = null;
      const empty = !messageBox.value && attached.length === 0;
      const body = { text: messageBox.value };
      if (withFiles) {
        body.files = attached.map((file) =>
          file.image ? { name: file.name, image: file.image } : { name: file.name, text: file.text });
      }
      const request = () => empty
        ? fetch("/api/drafts/" + key, { method: "DELETE", keepalive })
        : fetch("/api/drafts/" + key, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
            keepalive,
          });
      if (keepalive) request().catch(() => {});
      else draftQueue = draftQueue.then(request).catch(() => {});
    }

    function scheduleDraft() {
      clearTimeout(draftTimer);
      draftTimer = setTimeout(() => saveDraft(), 400);
    }

    function dropDraft(key) {
      clearTimeout(draftTimer);
      draftTimer = null;
      draftQueue = draftQueue.then(() => fetch("/api/drafts/" + key, { method: "DELETE" })).catch(() => {});
    }

    function flushDraft(keepalive = false) {
      if (draftTimer !== null) saveDraft(draftKey(), false, keepalive);
    }

        await draftQueue;
        const response = await fetch("/api/drafts/" + key);
        if (!response.ok) return;
        draft = await response.json();
      } catch (error) {
        return;
      }
      // Ignore the answer if the user moved on, or has already started typing.
      if (draftKey() !== key || messageBox.value || attached.length) return;
      messageBox.value = draft.text || "";
      attached = draft.files || [];
      renderChips();
      messageBox.style.height = "auto";
      messageBox.style.height = Math.min(messageBox.scrollHeight, 160) + "px";
    }

    async function send() {
      const content = messageBox.value.trim();
      if (!content || activeRequest) return;
      const model = modelSelect.value;
      if (!model) {
        loadModels();
        return;
      }
      if (inCodeView() && attached.some((file) => file.image)) {
        notify("The code editor cannot send pictures. Remove the picture, or use the Chat tab.");
        return;
      }
      if (attached.some((file) => file.image) && !isVision(model)) {
        const vision = visionModel();
        if (vision) {
          modelSelect.value = vision;
          notify("Switched to " + vision + " to read your image. Press send again.");
        } else {
          notify("Images need a Gemma model. Remove the image or install gemma3.");
        }
        return;
      }
      const draftOwner = draftKey();
      askNotifyPermission();
      if (!chatId) chatId = crypto.randomUUID();
      const thisChat = chatId;
      let outcome = "";
      let failure = "";
      const files = attached;
      attached = [];
      renderChips();
      messages.push({ role: "user", content, files: files.length ? files : undefined });
      const sent = addTurn("user", content, "", files);
      messageBox.value = "";
      messageBox.style.height = "";
      dropDraft(draftOwner);
      let restored = false;
      const reply = addTurn("assistant", "");
      setBusy(true);
      status.textContent = "Streaming from " + model + "…";
      activeRequest = new AbortController();
      let saved = false;
      let answer = "";
      let thought = "";
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model,
            messages: messages.map((message, index) => {
              const out = { role: message.role, content: withFiles(message) };
              const pictures = (message.files || []).filter((file) => file.image).map((file) => file.image);
              if (pictures.length && index === messages.length - 1) out.images = pictures;
              return out;
            }),
          }),
          signal: activeRequest.signal,
        });
        if (!response.ok) {
          const failure = await response.json();
          throw new Error(failure.error || "chat failed");
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            const event = JSON.parse(line);
            if (event.error) throw new Error(event.error);
            thought += event.message?.thinking || "";
            answer += event.message?.content || "";
            reply.thinking.textContent = thought;
            reply.thinking.hidden = !thought;
            reply.answer.textContent = answer;
            scrollLog();
          }
        }
        if (!answer && !thought) {
          messages.pop();
          outcome = "failed";
          failure = "The model sent no reply.";
        } else {
          outcome = "done";
        }
      } catch (error) {
        if (error.name === "AbortError" && !answer && !thought) {
          sent.block.remove();
          reply.block.remove();
          messageBox.value = content;
          attached = files;
          renderChips();
          restored = true;
          if (messages.length <= 1) showEmpty();
        }
        if (error.name !== "AbortError") {
          outcome = "failed";
          failure = plainError(error.message);
          if (answer || thought) {
            const note = document.createElement("div");
            note.className = "thinking";
            note.textContent = "The reply was cut off: " + plainError(error.message);
            reply.answer.after(note);
          } else {
            reply.answer.textContent = plainError(error.message);
          }
        }
        if (!answer && !thought) messages.pop();
      } finally {
        if (answer || thought) {
          messages.push({ role: "assistant", content: answer, thinking: thought || undefined, model });
          saved = true;
        }
        activeRequest = null;
        if (messages.length === 0) chatId = null;
        if (restored) saveDraft(draftKey(), true);
        setBusy(false);
        refreshState();
        messageBox.focus();
      }
      if (saved) await saveChat();
      const name = chats.find((chat) => chat.id === thisChat)?.title || "";
      if (outcome === "done") announce("Reply ready", name, answer || thought, thisChat);
      else if (outcome === "failed") announce("Reply stopped", name, failure, thisChat);
    }

    document.querySelector("#composer").addEventListener("submit", (event) => {
      event.preventDefault();
      if (activeRequest) {
        activeRequest.abort();
        return;
      }
      send();
    });
    messageBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {

      }
    });
    messageBox.addEventListener("input", () => {
      messageBox.style.height = "auto";

      scheduleDraft();

    window.addEventListener("pagehide", () => flushDraft(true));
    document.addEventListener("visibilitychange", () => {

    let dragDepth = 0;
    const hasFiles = (event) => [...(event.dataTransfer?.types || [])].includes("Files");
    window.addEventListener("dragenter", (event) => {
      if (!hasFiles(event) || activeRequest) return;
      dragDepth += 1;
      document.body.classList.add("dragging");
    });
    window.addEventListener("dragleave", (event) => {
      if (!hasFiles(event)) return;
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) document.body.classList.remove("dragging");
    });
    window.addEventListener("dragover", (event) => {
      if (hasFiles(event)) event.preventDefault();
    });
    window.addEventListener("drop", async (event) => {
      if (!hasFiles(event)) return;
      event.preventDefault();
      dragDepth = 0;

    attachButton.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", async () => {

    modelSelect.addEventListener("change", () => {

    document.querySelector("#new-chat").addEventListener("click", newChat);

    // Notifications. Only when you are away from the page (another tab or
    // window): the tab title changes, and the browser shows a notification if
    // it was allowed. Clicking the notification brings you back to that chat.
    const NOTIFY_KEY = "lightusagi-notify";
    const BASE_TITLE = "LightUsagi";
    const notifyNote = document.querySelector("#notify-note");
    const canNotify = "Notification" in window;
    const notifyOn = () => localStorage.getItem(NOTIFY_KEY) !== "off";
    const userIsAway = () => document.hidden || !document.hasFocus();

    function updateNotifySettings() {
      document.querySelector("#notify-toggle").checked = notifyOn();
      if (!notifyOn()) notifyNote.textContent = "";
      else if (!canNotify) notifyNote.textContent = "This browser cannot show notifications here. The tab title will change instead.";
      else if (Notification.permission === "denied") notifyNote.textContent = "Notifications are blocked for this site in the browser settings. The tab title will still change.";
      else if (Notification.permission === "default") notifyNote.textContent = "The browser will ask for permission the first time.";
      else notifyNote.textContent = "You will be told when a reply finishes while you are in another tab or window.";
    }

    function askNotifyPermission() {
      if (!notifyOn() || !canNotify || Notification.permission !== "default") return;
      Promise.resolve(Notification.requestPermission()).then(updateNotifySettings, () => {});
    }

    function announce(heading, chatName, detail, id) {
      if (!notifyOn() || !userIsAway()) return;
      document.title = "\u25cf " + heading + " \u00b7 " + BASE_TITLE;
      if (!canNotify || Notification.permission !== "granted") return;
      try {
        const note = new Notification(heading, {
          body: (chatName ? chatName + "\n" : "") + detail.replace(/\s+/g, " ").trim().slice(0, 120),
          tag: "lightusagi-reply",
        });
        note.onclick = () => {
          window.focus();
          note.close();
          if (id && id !== chatId) openChat(id);
        };
        setTimeout(() => note.close(), 10000);
      } catch (error) {
        // Some browsers only allow notifications from a service worker; the title still changed.
      }
    }

    function clearAnnouncement() {
      if (!userIsAway()) document.title = BASE_TITLE;
    }

    document.querySelector("#notify-toggle").addEventListener("change", (event) => {
      localStorage.setItem(NOTIFY_KEY, event.target.checked ? "on" : "off");
      updateNotifySettings();
      askNotifyPermission();
    });
    window.addEventListener("focus", clearAnnouncement);
    document.addEventListener("visibilitychange", clearAnnouncement);
    updateNotifySettings();

    function applyTheme(theme) {

    settings.addEventListener("click", (event) => {
