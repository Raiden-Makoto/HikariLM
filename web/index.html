    // Files section. The helper reads and writes the folder; the page only
    // shows one file at a time. The file on disk is the only copy of the text.
    const FOLDER_KEY = "lightusagi-folder";
    const KIND_KEY = "lightusagi-folder-kind";
    const folderLabel = document.querySelector("#folder-label");
    const fileFilter = document.querySelector("#file-filter");
    let allFiles = [];
    let filesCut = false;
    const folderNote = document.querySelector("#folder-note");
    const fileList = document.querySelector("#file-list");
    const fileTitle = document.querySelector("#file-title");
    const fileNote = document.querySelector("#file-note");
    const fileHost = document.querySelector("#file-text");
    // The editor is CodeMirror, one file loaded the first time the code editor
    // is opened. Until it arrives there is simply an empty box.
    let editor = null;
    let editorLoading = null;
    function loadEditor() {
      if (editor) return Promise.resolve(editor);
      if (!editorLoading) {
        editorLoading = import("/vendor/codemirror.js").then((module) => {
          editor = module.createEditor(fileHost, {
            onChange: () => {
              fileNote.textContent = "";
              refreshFileButtons();
            },
            onSelection: () => refreshFileButtons(),
            onSave: () => saveOpenFile(),
          });
          return editor;
        }, (error) => {
          editorLoading = null;
          throw new Error("The code editor did not load (" + (error.message || error) + ").");
        });
      }
      return editorLoading;
    }
    const editorText = () => (editor ? editor.getValue() : "");
    const askFile = document.querySelector("#ask-file");
    const askSelection = document.querySelector("#ask-selection");
    const saveFile = document.querySelector("#save-file");
    const conflictBox = document.querySelector("#conflict");
    // Where the open folder lives. Either the helper's machine (read and
    // written by the helper) or this computer (a folder picked with the
    // browser's own folder picker, read and written by the page itself).
    let source = null;
    let folderName = "";
    let openPath = "";
    let openVersion = "";
    let savedText = "";
    let openToken = 0;
    let saving = false;
    let filesStarted = false;

    const hasEdits = () => Boolean(openPath) && editorText() !== savedText;

    async function filesApi(url, options) {
      const response = await fetch(url, options);
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(body.error || "The helper could not do that.");
        error.conflict = Boolean(body.conflict);
        throw error;
      }
      return body;
    }

    function helperSource(root) {
      const file = (path) => "/api/workspace/file?root=" + encodeURIComponent(root) + "&path=" + encodeURIComponent(path);
      return {
        kind: "helper",
        root,
        label: root,
        list: () => filesApi("/api/workspace?root=" + encodeURIComponent(root)),
        read: (path) => filesApi(file(path)),
        write: (path, text, version) => filesApi("/api/workspace/file", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ root, path, text, version }),
        }),
      };
    }

    // A folder on this computer, picked with the browser's folder picker. The
    // page does here what the helper does for the other kind of folder, with
    // the same rules: everyday file kinds only, nothing outside the folder,
    // 500 KB at most, the same encoding and line endings written back, and a
    // refusal if the file changed since it was opened.
    const LOCAL_EXTENSIONS = new Set(("txt md rst log csv tsv json yaml yml toml ini xml html css py r c h cpp hpp " +
      "java kt go rs rb php swift cs scala lua pl js ts jsx tsx sh sql tex").split(" "));
    const LOCAL_NAMES = new Set(["makefile", "dockerfile", "readme", "license"]);
    const LOCAL_SKIP = new Set(["node_modules", "__pycache__", "venv"]);
    const LOCAL_MAX_FILES = 200;
    const LOCAL_MAX_DEPTH = 4;

    function localAllowed(name) {
      const lower = name.toLowerCase();
      const dot = lower.lastIndexOf(".");
      return (dot > 0 || (dot === 0 && lower.length > 1) ? LOCAL_EXTENSIONS.has(lower.slice(dot + 1)) : false) ||
        LOCAL_NAMES.has(lower);
    }

    async function sha1(bytes) {
      const digest = new Uint8Array(await crypto.subtle.digest("SHA-1", bytes));
      return [...digest].map((byte) => byte.toString(16).padStart(2, "0")).join("");
    }

    function localDecode(bytes, name) {
      const starts = (...head) => head.every((value, index) => bytes[index] === value);
      try {
        if (starts(0xef, 0xbb, 0xbf)) return { text: new TextDecoder("utf-8", { fatal: true }).decode(bytes.subarray(3)), codec: "utf-8", bom: [0xef, 0xbb, 0xbf] };
        if (starts(0xff, 0xfe)) return { text: new TextDecoder("utf-16le").decode(bytes.subarray(2)), codec: "utf-16le", bom: [0xff, 0xfe] };
        if (starts(0xfe, 0xff)) return { text: new TextDecoder("utf-16be").decode(bytes.subarray(2)), codec: "utf-16be", bom: [0xfe, 0xff] };
      } catch (error) {
        throw new Error(name + " is not text this page can read.");
      }
      if (bytes.includes(0)) throw new Error(name + " has binary bytes, so it is not opened.");
      try {
        return { text: new TextDecoder("utf-8", { fatal: true }).decode(bytes), codec: "utf-8", bom: [] };
      } catch (error) {
        return { text: new TextDecoder("windows-1252").decode(bytes), codec: "windows-1252", bom: [] };
      }
    }

    let cp1252Bytes = null;
    function localEncode(text, codec, name) {
      if (codec === "utf-8") return new TextEncoder().encode(text);
      if (codec === "utf-16le" || codec === "utf-16be") {
        const out = new Uint8Array(text.length * 2);
        for (let i = 0; i < text.length; i += 1) {
          const unit = text.charCodeAt(i);
          const [low, high] = codec === "utf-16le" ? [i * 2, i * 2 + 1] : [i * 2 + 1, i * 2];
          out[low] = unit & 255;
          out[high] = unit >> 8;
        }
        return out;
      }
      if (!cp1252Bytes) {
        cp1252Bytes = new Map();
        const decoder = new TextDecoder("windows-1252");
        for (let value = 0; value < 256; value += 1) cp1252Bytes.set(decoder.decode(new Uint8Array([value])), value);
      }
      const out = [];
      for (const character of text) {
        const value = cp1252Bytes.get(character);
        if (value === undefined) throw new Error(name + " is saved as windows-1252, which cannot hold a character you typed.");
        out.push(value);
      }
      return Uint8Array.from(out);
    }

    function localFailure(error, name) {
      if (error instanceof Error && !error.name.endsWith("Error")) return error;
      if (error.name === "NotFoundError" || error.name === "TypeMismatchError") return new Error(name + " is not in the folder any more.");
      if (error.name === "NotAllowedError" || error.name === "SecurityError") return new Error("The browser no longer lets this page use that folder. Choose it again.");
      return error;
    }

    function localSource(root) {
      const handleFor = async (path) => {
        const parts = path.split("/");
        if (!path || path.startsWith("/") || path.includes("\\") || parts.some((part) => !part || part === "." || part === "..")) {
          throw new Error("That path leaves the opened folder.");
        }
        let directory = root;
        for (const part of parts.slice(0, -1)) directory = await directory.getDirectoryHandle(part);
        const name = parts[parts.length - 1];
        if (!localAllowed(name)) throw new Error(name + " is not a kind of file this page opens.");
        return directory.getFileHandle(name);
      };
      const readBytes = async (handle) => {
        const file = await handle.getFile();
        if (file.size > MAX_FILE) throw new Error(file.name + " is " + Math.round(file.size / 1000) + " KB. Files over 500 KB are not opened.");
        return new Uint8Array(await file.arrayBuffer());
      };
      return {
        kind: "local",
        root,
        label: root.name + "  (on this computer)",
        async list() {
          const found = [];
          let cut = false;
          const walk = async (directory, prefix, depth) => {
            const entries = [];
            for await (const [name, entry] of directory.entries()) entries.push([name, entry]);
            entries.sort((a, b) => (a[0].toLowerCase() < b[0].toLowerCase() ? -1 : a[0].toLowerCase() > b[0].toLowerCase() ? 1 : 0));
            for (const [name, entry] of entries) {
              if (cut) return;
              if (entry.kind === "directory") {
                if (name.startsWith(".") || LOCAL_SKIP.has(name) || depth >= LOCAL_MAX_DEPTH) continue;
                await walk(entry, prefix + name + "/", depth + 1);
              } else if (localAllowed(name)) {
                if (found.length >= LOCAL_MAX_FILES) {
                  cut = true;
                  return;
                }
                found.push(prefix + name);
              }
            }
          };
          try {
            await walk(root, "", 0);
          } catch (error) {
            throw localFailure(error, root.name);
          }
          return { root: root.name, name: root.name, files: found, cut };
        },
        async read(path) {
          try {
            const bytes = await readBytes(await handleFor(path));
            const { text } = localDecode(bytes, path);
            return { path, text: text.replace(/\r\n/g, "\n"), version: await sha1(bytes) };
          } catch (error) {
            throw localFailure(error, path);
          }
        },
        async write(path, text, version) {
          try {
            const handle = await handleFor(path);
            const bytes = await readBytes(handle);
            if ((await sha1(bytes)) !== version) {
              const error = new Error(path + " was changed on disk after you opened it.");
              error.conflict = true;
              throw error;
            }
            const { text: before, codec, bom } = localDecode(bytes, path);
            let body = text.replace(/\r\n/g, "\n");
            if (before.includes("\r\n")) body = body.replace(/\n/g, "\r\n");
            const encoded = localEncode(body, codec, path);
            const data = new Uint8Array(bom.length + encoded.length);
            data.set(bom);
            data.set(encoded, bom.length);
            if (data.length > MAX_FILE) throw new Error("The file would be over 500 KB, so it was not saved.");
            if (data.length === bytes.length && data.every((value, index) => value === bytes[index])) {
              return { version, changed: false };
            }
            const writer = await handle.createWritable();
            try {
              await writer.write(data);
              await writer.close();
            } catch (error) {
              try { await writer.abort(); } catch (ignored) { /* already closed */ }
              throw error;
            }
            return { version: await sha1(data), changed: true };
          } catch (error) {
            throw localFailure(error, path);
          }
        },
      };
    }

    // The browser keeps a picked folder in its own storage, so it can be
    // offered again after a reload. It still asks the user's permission first.
    function handleStore(mode, run) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("lightusagi", 1);
        request.onupgradeneeded = () => request.result.createObjectStore("handles");
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          const db = request.result;
          const tx = db.transaction("handles", mode);
          const result = run(tx.objectStore("handles"));
          tx.oncomplete = () => { db.close(); resolve(result.result); };
          tx.onerror = () => { db.close(); reject(tx.error); };
        };
      });
    }
    const rememberHandle = (handle) => handleStore("readwrite", (store) => store.put(handle, "last")).catch(() => {});
    const recallHandle = () => handleStore("readonly", (store) => store.get("last")).catch(() => undefined);

    function discardOk() {
      return !hasEdits() || confirm("This file has changes that are not saved. Leave them behind?");
    }

    function refreshFileButtons() {
      const open = Boolean(openPath);
      fileTitle.textContent = open ? openPath + (hasEdits() ? " ●" : "") : "No file open";
      saveFile.disabled = !open || saving || !hasEdits();
      askFile.disabled = !open || Boolean(activeRequest);
      const picked = editor ? editor.getSelection() : { from: 0, to: 0 };
      askSelection.disabled = !open || Boolean(activeRequest) || picked.from === picked.to;
    }

    // Open the folder used last time. A folder from this computer needs the
    // user's permission again after a reload, so it may only be offered.
    async function reopenLast() {
      if (localStorage.getItem(KIND_KEY) === "local") {
        const handle = await recallHandle();
        if (handle && (await handle.queryPermission({ mode: "readwrite" }).catch(() => "")) === "granted") {
          if (await openLocalFolder(handle, true)) {
            restoreFile();
            return;
          }
        }
      } else {
        const last = localStorage.getItem(FOLDER_KEY) || "";
        if (last && (await openFolder(last, true))) {
          restoreFile();
          return;
        }
      }
      showFolderDialog();
    }

    // Each section has its own address, so a reload or a bookmark comes back
    // to the same section: /chat and /editor. Returns false if the user chose
    // to stay because of unsaved edits.
    const SECTION_PATHS = { chat: "/chat", files: "/editor" };
    const SECTION_KEY = "lightusagi-section";
    const FILE_KEY = "lightusagi-file";
    const sectionFromPath = () => (/^\/editor\/?$/.test(location.pathname) ? "files" : "chat");
    // A plain "/" has no section in it, so it opens the one used last.
    const sectionToOpen = () =>
      (/^\/(chat|editor)\/?$/.test(location.pathname) ? sectionFromPath() : localStorage.getItem(SECTION_KEY) || "chat");

    // After a reload, put the file that was open back in the editor.
    function restoreFile() {
      let saved;
      try {
        saved = JSON.parse(localStorage.getItem(FILE_KEY) || "null");
      } catch (error) {
        return;
      }
      if (!saved || !source || saved.kind !== source.kind || openPath) return;
      const folder = source.kind === "helper" ? source.root : source.root.name;
      if (saved.folder === folder && allFiles.includes(saved.path)) openFileAt(saved.path, true);
    }

    function setSection(name, how = "push") {
      const files = name === "files";
      if (!files && !discardOk()) return false;
      if (how !== "url" && location.pathname !== SECTION_PATHS[name]) {
        history[how === "replace" ? "replaceState" : "pushState"](null, "", SECTION_PATHS[name]);
      }
      document.body.classList.toggle("view-files", files);
      localStorage.setItem(SECTION_KEY, name);
      fileInput.accept = files ? [...TEXT_EXTENSIONS].map((ext) => "." + ext).join(",") : "";
      attachButton.title = files ? "Attach text or code files" : "Attach text, code, PDF, Word, Excel or picture files";
      if (!activeRequest) fillModels();
      document.querySelector("#tab-chat").setAttribute("aria-selected", String(!files));
      document.querySelector("#tab-files").setAttribute("aria-selected", String(files));
      if (files) {
        closeMenu();
        loadEditor().catch((error) => { fileNote.textContent = error.message; });
        if (!filesStarted) {
          filesStarted = true;
          reopenLast();
        }
        refreshFileButtons();
      } else {
        messageBox.focus();
      }
      return true;
    }

    window.addEventListener("popstate", () => {
      const want = sectionFromPath();
      const now = document.body.classList.contains("view-files") ? "files" : "chat";
      if (want === now) return;
      // Back or forward with unsaved edits: asked first, and refusing stays put.
      if (!setSection(want, "url")) history.pushState(null, "", SECTION_PATHS[now]);
    });

    function closeFile() {
      openToken += 1;
      openPath = "";
      openVersion = "";
      savedText = "";
      if (editor) editor.close();
      conflictBox.hidden = true;
      fileNote.textContent = "";
      refreshFileButtons();
    }

    function renderFiles() {
      const files = allFiles;
      const cut = filesCut;
      const needle = fileFilter.value.trim().toLowerCase();
      const shown = needle ? files.filter((path) => path.toLowerCase().includes(needle)) : files;
      fileList.replaceChildren();
      for (const path of shown) {
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = path;
        button.title = path;
        if (path === openPath) button.setAttribute("aria-current", "true");
        button.addEventListener("click", () => openFileAt(path));
        item.append(button);
        fileList.append(item);
      }
      if (!files.length) folderNote.textContent = "No files of a kind this page opens in " + folderName + ".";
      else if (needle) folderNote.textContent = shown.length + " of " + files.length + " files match.";
      else if (cut) folderNote.textContent = "Showing the first " + files.length + " files. This is meant for a small folder.";
      else folderNote.textContent = files.length + (files.length === 1 ? " file in " : " files in ") + folderName + ".";
    }

    // Returns true when the folder was opened.
    async function openFolder(path, quiet = false) {
      path = path.trim();
      if (!path) return false;
      return openSource(helperSource(path), quiet);
    }

    async function openLocalFolder(handle, quiet = false) {
      return openSource(localSource(handle), quiet);
    }

    async function openSource(next, quiet = false) {
      if (!discardOk()) return false;
      folderNote.textContent = "Opening…";
      try {
        const body = await next.list();
        closeFile();
        // The helper tidies the path it was given (for example ~), so keep its answer.
        source = next.kind === "helper" ? helperSource(body.root) : next;
        folderName = body.name;
        allFiles = body.files;
        filesCut = body.cut;
        fileFilter.value = "";
        fileFilter.disabled = false;
        folderLabel.textContent = source.label;
        folderLabel.title = source.label;
        localStorage.setItem(KIND_KEY, source.kind);
        if (source.kind === "helper") localStorage.setItem(FOLDER_KEY, body.root);
        else rememberHandle(source.root);
        renderFiles();
        return true;
      } catch (error) {
        if (!quiet) closeFile();
        source = null;
        allFiles = [];
        fileFilter.disabled = true;
        folderLabel.textContent = "No folder open";
        fileList.replaceChildren();
        folderNote.textContent = plainError(error.message);
        return false;
      }
    }

    // The folder chooser: click through folders, filter them by typing, or
    // type a whole path and press Enter. Only folder names are listed.
    const folderDialog = document.querySelector("#folder-dialog");
    const browseInput = document.querySelector("#browse-input");
    const browseList = document.querySelector("#browse-list");
    const browseNote = document.querySelector("#browse-note");
    let browsing = null;
    let browseToken = 0;
    const looksLikePath = (text) => /^(\/|~|\.\.?\/)/.test(text.trim());

    function renderBrowse() {
      browseList.replaceChildren();
      if (!browsing) return;
      const needle = looksLikePath(browseInput.value) ? "" : browseInput.value.trim().toLowerCase();
      const add = (label, path, className) => {
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        if (className) button.className = className;
        button.addEventListener("click", () => browseTo(path));
        item.append(button);
        browseList.append(item);
      };
      if (browsing.parent && !needle) add("↑  Up one folder", browsing.parent, "up");
      const join = (name) => (browsing.path === "/" ? "" : browsing.path) + "/" + name;
      const shown = browsing.folders.filter((name) => name.toLowerCase().includes(needle));
      for (const name of shown) add("📁  " + name, join(name));
      const bits = [];
      if (!browsing.folders.length) bits.push("No folders in here.");
      else if (needle) bits.push(shown.length + " of " + browsing.folders.length + " folders match.");
      if (browsing.cut) bits.push("Only the first 1000 folders are listed. Type a path to go further.");
      bits.push(browsing.files === 1
        ? "1 file of a kind this page opens is directly in this folder."
        : browsing.files + " files of a kind this page opens are directly in this folder.");
      browseNote.textContent = bits.join(" ");
    }

    async function browseTo(path) {
      const token = ++browseToken;
      try {
        const body = await filesApi("/api/workspace/browse?path=" + encodeURIComponent(path));
        if (token !== browseToken) return;
        browsing = body;
        browseInput.value = "";
        document.querySelector("#browse-path").textContent = body.path;
        renderBrowse();
      } catch (error) {
        if (token !== browseToken) return;
        browseNote.textContent = plainError(error.message);
      }
    }

    function showFolderDialog() {
      if (!discardOk()) return;
      if (!folderDialog.open) folderDialog.showModal();
      browseInput.value = "";
      browseTo(source && source.kind === "helper" ? source.root : "");
      showLocalOptions();
      browseInput.focus();
    }

    browseInput.addEventListener("input", renderBrowse);
    browseInput.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      event.preventDefault();
      const typed = browseInput.value.trim();
      if (looksLikePath(typed)) browseTo(typed);
      else if (browseList.querySelectorAll("button:not(.up)").length === 1) browseList.querySelector("button:not(.up)").click();
    });
    document.querySelector("#browse-home").addEventListener("click", () => browseTo(""));
    document.querySelector("#browse-open").addEventListener("click", async () => {
      if (!browsing) return;
      if (await openFolder(browsing.path)) folderDialog.close();
      else browseNote.textContent = folderNote.textContent;
    });
    const pickLocal = document.querySelector("#pick-local");
    const reopenLocal = document.querySelector("#reopen-local");
    const localNote = document.querySelector("#local-note");
    const canPickLocal = typeof window.showDirectoryPicker === "function";

    async function showLocalOptions() {
      localNote.textContent = canPickLocal
        ? "Your browser won't let a page open your home folder, Documents, Desktop, Downloads, a whole drive, or system folders. Pick a folder inside one of them, such as a project folder."
        : "This browser has no folder picker for web pages. Use the list below.";
      pickLocal.disabled = !canPickLocal;
      reopenLocal.hidden = true;
      if (!canPickLocal) return;
      const handle = await recallHandle();
      if (!handle || (source && source.kind === "local" && (await source.root.isSameEntry(handle).catch(() => false)))) return;
      reopenLocal.textContent = "Reopen " + handle.name;
      reopenLocal.hidden = false;
    }

    async function useLocalHandle(getHandle) {
      let handle;
      try {
        handle = await getHandle();
      } catch (error) {
        if (error.name !== "AbortError") localNote.textContent = plainError(error.message);
        return;
      }
      if (!handle) return;
      if (await openLocalFolder(handle)) folderDialog.close();
      else localNote.textContent = folderNote.textContent;
    }

    pickLocal.addEventListener("click", () => useLocalHandle(() => window.showDirectoryPicker({ id: "lightusagi", mode: "readwrite" })));
    reopenLocal.addEventListener("click", () => useLocalHandle(async () => {
      const handle = await recallHandle();
      if (!handle) return null;
      const permission = await handle.requestPermission({ mode: "readwrite" });
      if (permission !== "granted") throw new Error("The browser did not give this page access to " + handle.name + ".");
      return handle;
    }));
    document.querySelector("#close-folder").addEventListener("click", () => folderDialog.close());
    document.querySelector("#choose-folder").addEventListener("click", showFolderDialog);
    fileFilter.addEventListener("input", renderFiles);

    async function openFileAt(path, force = false) {
      if (!force) {
        if (path === openPath && !hasEdits()) return;
        if (!discardOk()) return;
      }
      const token = ++openToken;
      fileNote.textContent = "Opening…";
      conflictBox.hidden = true;
      try {
        const [body, ed] = await Promise.all([source.read(path), loadEditor()]);
        if (token !== openToken) return;
        openPath = body.path;
        openVersion = body.version;
        savedText = body.text;
        ed.open(body.text, openPath);
        fileNote.textContent = "";
        localStorage.setItem(FILE_KEY, JSON.stringify({
          kind: source.kind,
          folder: source.kind === "helper" ? source.root : source.root.name,
          path: openPath,
        }));
        fileList.querySelectorAll("button").forEach((button) => {
          if (button.title !== openPath) button.removeAttribute("aria-current");
          else button.setAttribute("aria-current", "true");
        });
      } catch (error) {
        if (token !== openToken) return;
        fileNote.textContent = plainError(error.message);
      }
      refreshFileButtons();
    }

    async function saveOpenFile() {
      if (!hasEdits() || saving) return;
      saving = true;
      refreshFileButtons();
      const sent = editorText();
      const path = openPath;
      try {
        const body = await source.write(path, sent, openVersion);
        if (path === openPath) {
          openVersion = body.version;
          savedText = sent;
          fileNote.textContent = body.changed ? "Saved." : "Nothing to save.";
        }
      } catch (error) {
        if (error.conflict) {
          document.querySelector("#conflict-text").textContent = error.message;
          conflictBox.hidden = false;
          fileNote.textContent = "Not saved.";
        } else {
          fileNote.textContent = "Not saved: " + plainError(error.message);
        }
      }
      saving = false;
      refreshFileButtons();
    }

    async function askAbout(selectionOnly) {
      if (!openPath || activeRequest) return;
      if (hasEdits()) {
        fileNote.textContent = "Save the file first, so the question is about what is really in it.";
        return;
      }
      let body;
      try {
        body = await source.read(openPath);
      } catch (error) {
        fileNote.textContent = plainError(error.message);
        return;
      }
      let text = body.text;
      let name = folderName + "/" + body.path;
      if (selectionOnly) {
        // Not dirty, so the highlight's offsets are offsets into the disk text.
        const { from: start, to: end } = editor ? editor.getSelection() : { from: 0, to: 0 };
        if (start === end || body.text !== editorText()) {
          fileNote.textContent = "Highlight some text first.";
          return;
        }
        text = text.slice(start, end);
        const first = body.text.slice(0, start).split("\n").length;
        const last = first + text.replace(/\n+$/, "").split("\n").length - 1;
        name += first === last ? " line " + first : " lines " + first + "–" + last;
      }
      const used = attached.reduce((sum, file) => sum + (file.text || "").length, 0);
      if (used + text.length > MAX_FILES_TOTAL) {
        fileNote.textContent = "That would make the attached files too big for one message.";
        return;
      }
      if (!text.trim()) {
        fileNote.textContent = "There is no text there to ask about.";
        return;
      }
      const coder = [...modelSelect.options].map((option) => option.value)
        .find((value) => value && codeRank(value) < 2);
      let note = "";
      if (coder) {
        modelSelect.value = coder;
        note = " Model: " + coder + ".";
      } else if (modelSelect.value) {
        note = " No coder model is installed, so " + modelSelect.value + " will answer.";
      }
      const same = attached.findIndex((file) => file.name === name);
      if (same >= 0) attached.splice(same, 1);
      attached.push({ name, text });
      renderChips();
      saveDraft(draftKey(), true);
      notify("Attached " + name + "." + note + " Type your question and press Enter.");
      messageBox.focus();
    }

    document.querySelector("#tab-chat").addEventListener("click", () => setSection("chat"));
    document.querySelector("#tab-files").addEventListener("click", () => setSection("files"));
    document.addEventListener("busychange", () => {
      refreshFileButtons();
      // A tab switched mid-reply left the picker on the other view's list.
      const shown = [...modelSelect.options].map((option) => option.value).filter(Boolean);
      if (!activeRequest && shown.join("\n") !== modelsForView().join("\n")) fillModels();
    });

    // Ctrl+B (Cmd+B on a Mac) hides and shows the file list, as in Cursor.
    const FILES_HIDDEN_KEY = "lightusagi-files-hidden";
    const toggleFiles = document.querySelector("#toggle-files");
    const isMac = /mac|iphone|ipad/i.test(navigator.platform || "");

    function setFilesHidden(hidden) {
      document.body.classList.toggle("files-hidden", hidden);
      toggleFiles.setAttribute("aria-expanded", String(!hidden));
      const keys = isMac ? "⌘B" : "Ctrl+B";
      toggleFiles.setAttribute("aria-label", hidden ? "Show files" : "Hide files");
      toggleFiles.title = (hidden ? "Show files (" : "Hide files (") + keys + ")";
      localStorage.setItem(FILES_HIDDEN_KEY, hidden ? "1" : "0");
    }
    toggleFiles.addEventListener("click", () => setFilesHidden(!document.body.classList.contains("files-hidden")));
    document.addEventListener("keydown", (event) => {
      if (!inCodeView() || event.altKey || event.shiftKey || event.key.toLowerCase() !== "b") return;
      if (!(isMac ? event.metaKey : event.ctrlKey)) return;
      event.preventDefault();
      setFilesHidden(!document.body.classList.contains("files-hidden"));
    });
    setFilesHidden(localStorage.getItem(FILES_HIDDEN_KEY) === "1");

    // The chat pane's left edge can be dragged (or moved with the arrow keys
    // while it has focus). Double-click puts it back. The width is remembered.
    const PANE_KEY = "lightusagi-pane";
    const paneResize = document.querySelector("#pane-resize");
    const chatPane = document.querySelector("#chat-pane");
    const clampPane = (width) => Math.max(320, Math.min(width, window.innerWidth * 0.75, window.innerWidth - 360));

    function setPane(width, keep = true) {
      if (width === null) {
        document.documentElement.style.removeProperty("--pane-w");
        localStorage.removeItem(PANE_KEY);
        return;
      }
      const value = Math.round(clampPane(width));
      document.documentElement.style.setProperty("--pane-w", value + "px");
      if (keep) localStorage.setItem(PANE_KEY, String(value));
    }
    paneResize.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      paneResize.setPointerCapture(event.pointerId);
      document.body.classList.add("resizing");
    });
    paneResize.addEventListener("pointermove", (event) => {
      if (!paneResize.hasPointerCapture(event.pointerId)) return;
      setPane(chatPane.parentElement.getBoundingClientRect().right - event.clientX, false);
    });
    const endResize = (event) => {
      if (!paneResize.hasPointerCapture(event.pointerId)) return;
      paneResize.releasePointerCapture(event.pointerId);
      document.body.classList.remove("resizing");
      setPane(chatPane.getBoundingClientRect().width);
    };
    paneResize.addEventListener("pointerup", endResize);
    paneResize.addEventListener("pointercancel", endResize);
    paneResize.addEventListener("dblclick", () => setPane(null));
    paneResize.addEventListener("keydown", (event) => {
      const step = event.shiftKey ? 80 : 24;
      const now = chatPane.getBoundingClientRect().width;
      if (event.key === "ArrowLeft") setPane(now + step);
      else if (event.key === "ArrowRight") setPane(now - step);
      else if (event.key === "Home" || event.key === "Escape") setPane(null);
      else return;
      event.preventDefault();
    });
    const savedPane = Number(localStorage.getItem(PANE_KEY));
    if (savedPane > 0) setPane(savedPane, false);
    saveFile.addEventListener("click", saveOpenFile);
    askFile.addEventListener("click", () => askAbout(false));
    askSelection.addEventListener("click", () => askAbout(true));
    document.querySelector("#conflict-keep").addEventListener("click", () => { conflictBox.hidden = true; });
    document.querySelector("#conflict-reload").addEventListener("click", () => {
      conflictBox.hidden = true;
      openFileAt(openPath, true);
    });
    window.addEventListener("beforeunload", (event) => {
      if (hasEdits()) event.preventDefault();
    });

    applyTheme(localStorage.getItem("lightusagi-theme") || "light");
    applyBackground(localStorage.getItem("lightusagi-bg") || "");
    setSidebar(narrow.matches ? false : localStorage.getItem("lightusagi-sidebar") !== "closed");
    showEmpty();
    messageBox.focus();
    setSection(sectionToOpen(), "replace");
    (async () => {
      await loadModels();
      await refreshChats();
      const last = localStorage.getItem(LAST_CHAT);
      if (last) await openChat(last);
      if (!chatId) localStorage.removeItem(LAST_CHAT);
      await loadDraft(draftKey());
    })();
  </script>
</body>
</html>
